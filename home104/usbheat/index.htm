<!DOCTYPE html>
<html>
 
<head>
    <meta charset="utf-8">
    <title>Control system</title>
    <script src="https://cdn.zingchart.com/zingchart.min.js"></script>
    <style>
        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
 
        .chart--container {
            height: 100%;
            width: 100%;
            min-height: 150px;
        }
 
        .zc-ref {
            display: none;
        }
 
        zing-grid[loading] {
            height: 450px;
        }
    </style>
</head>
 
<body>
    <!-- CHART CONTAINER -->
    <div id="myChart" class="chart--container">
        <a class="zc-ref" href="https://www.zingchart.com">Control system</a>
    </div>
    <script>
        ZC.LICENSE = ["569d52cefae586f634c54f86dc99e6a9", "b55b025e438fa8a98e32482b5f768ff5"]; // window.onload event for Javascript to run after HTML
        // because this Javascript is injected into the document head
        window.addEventListener('load', () => {
            // Javascript code to execute after DOM content
 
            // render chart with width and height to
            // fill the parent container CSS dimensions
            zingchart.render({
                id: 'myChart',
                dataurl: '/json/solar',
                height: '100%',
                width: '100%'
            });
        });
    </script>
</body>
 
</html>
